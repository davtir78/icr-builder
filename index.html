<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICR Builder</title>
  <meta name="description" content="Build an Integration Contract Record (ICR v0.2) step by step: guided sections, a live conformance checklist, a Mermaid flow helper, and markdown import and export. Runs in your browser; nothing is sent anywhere, except the diagram library, fetched from a public CDN only if you choose to draw." />
  <meta name="color-scheme" content="light dark" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%97%86%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div id="app"></div>
  <noscript><p style="padding:16px">The ICR Builder needs JavaScript. It runs entirely in your browser and sends nothing anywhere, except the diagram library, fetched from a public CDN only if you choose to draw.</p></noscript>
  <!-- ES modules: serve this folder over http (node serve.mjs); browsers do not load modules from file:// -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
